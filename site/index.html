<meta charset="utf-8">

<title>Academy · Qualidade, Lean Six Sigma e Quality Analytics</title>
<meta name="description" content="Plataforma de formação em Engenharia da Qualidade, Lean Six Sigma e Quality Analytics, com laboratório Python no navegador.">
<meta name="theme-color" content="#0f3a4a">
<link rel="stylesheet" href="assets/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230f3a4a'/><path d='M8 21l5-11 3.4 7.2L19 14l5 7z' fill='none' stroke='%2354c8b0' stroke-width='2.2' stroke-linejoin='round' stroke-linecap='round'/></svg>">
<script>
  // Registo de conteudo. Os ficheiros de content/ chamam ACADEMY.reg(...).
  window.ACADEMY = {
    data: Object.create(null),
    _waiters: Object.create(null),
    reg: function (name, payload) {
      this.data[name] = payload;
      var w = this._waiters[name];
      if (w) { delete this._waiters[name]; w.forEach(function (f) { f(payload); }); }
    }
  };
  // tema antes da primeira pintura
  try {
    var t = localStorage.getItem('academy.theme');
    if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches))
      document.documentElement.setAttribute('data-theme', 'dark');
  } catch (e) {}
</script>
</head>
