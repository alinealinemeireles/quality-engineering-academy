<script>
  // Registo de conteudo. Os ficheiros de content/ chamam ACADEMY.reg(...).
  window.ACADEMY = {
    data: Object.create(null),
    _waiters: Object.create(null),
    reg: function (name, payload) {
      this.data[name] = payload;
      var w = this._waiters[name];
      if (w) { delete this._waiters[name]; w.forEach(function (f) { f(payload); }); }
    }
  };
  // tema antes da primeira pintura
  try {
    var t = localStorage.getItem('academy.theme');
    try { t = t == null ? t : JSON.parse(t); } catch (e2) {}
    if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches))
      document.documentElement.setAttribute('data-theme', 'dark');
  } catch (e) {}
</script>
