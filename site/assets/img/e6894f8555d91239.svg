<svg viewBox="0 0 920 400.0" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Verdana, sans-serif"><rect x="0" y="0" width="920" height="400.0" rx="14" fill="#fbfcfc" stroke="#d7e3e8" stroke-width="2"/><text x="18" y="26" font-size="13.5" font-weight="700" fill="#6b6459" letter-spacing=".4">ANOVA DE 1 VIA</text><line x1="16" y1="36" x2="904" y2="36" stroke="#d7e3e8" stroke-width="2"/><g transform="translate(16,42)"><rect x="0" y="0" width="436" height="214" rx="14" fill="#fbfcfc" stroke="#d7e3e8" stroke-width="2"/><rect x="18" y="16" width="22" height="22" rx="4" fill="#1e7a3f"/><text x="29.0" y="32.0" text-anchor="middle" font-size="13.64" font-weight="800" fill="#ffffff" font-family="'Segoe UI', Verdana, sans-serif">X</text><text x="48" y="33" font-size="15" font-weight="700" fill="#1a1a2e">Excel 365</text><line x1="16" y1="48" x2="420" y2="48" stroke="#d7e3e8" stroke-width="2"/><rect x="16" y="60" width="26" height="26" fill="#f3f2f1" stroke="#c8c6c4"/><text x="29.0" y="78.0" text-anchor="middle" font-size="12" font-style="italic" fill="#217346" font-weight="700">fx</text><rect x="42" y="60" width="378" height="26" fill="#ffffff" stroke="#c8c6c4"/><text x="50" y="78" font-size="12.5" font-family="Consolas, 'Courier New', monospace" fill="#31803a">=DIST.F(F; k-1; N-k; VERDADEIRO)</text><rect x="16" y="92" width="404" height="89" rx="6" fill="#e5f4e7"/><text x="24" y="108" font-size="11.5" fill="#1a1a2e">a partir das médias/n/S informados,</text><text x="24" y="123" font-size="11.5" fill="#1a1a2e">monte QMentre = Σnᵢ(x̄ᵢ−x̄̄)² / (k−1) e</text><text x="24" y="138" font-size="11.5" fill="#1a1a2e">use QMdentro = S² diretamente; F =</text><text x="24" y="153" font-size="11.5" fill="#1a1a2e">QMentre/QMdentro, e o valor-p com</text><text x="24" y="168" font-size="11.5" fill="#1a1a2e">=DIST.F(F; k-1;…</text></g><g transform="translate(468.0,42)"><rect x="0" y="0" width="436" height="354" rx="14" fill="#fbfcfc" stroke="#d7e3e8" stroke-width="2"/><rect x="18" y="16" width="22" height="22" rx="4" fill="#f2c811"/><text x="29.0" y="32.0" text-anchor="middle" font-size="11.0" font-weight="800" fill="#252423" font-family="'Segoe UI', Verdana, sans-serif">fx</text><text x="48" y="33" font-size="15" font-weight="700" fill="#1a1a2e">Power BI (DAX)</text><line x1="16" y1="48" x2="420" y2="48" stroke="#d7e3e8" stroke-width="2"/><rect x="16" y="58" width="404" height="232" rx="7" fill="#fffef6" stroke="#c2650c" stroke-width="1.6"/><text x="26" y="78" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#00688f">F Estatistica =</text><text x="26" y="96" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">VAR MediaGeral = (15*5.133 +</text><text x="26" y="114" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">15*5.667 + 15*7.000) / 45</text><text x="26" y="132" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">VAR QMEntre = (</text><text x="26" y="150" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">15*(5.133-MediaGeral)^2 +</text><text x="26" y="168" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">15*(5.667-MediaGeral)^2 +</text><text x="26" y="186" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">15*(7.000-MediaGeral)^2 ) / 2</text><text x="26" y="204" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">VAR QMDentro = 1.20581 ^ 2</text><text x="26" y="222" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">RETURN QMEntre / QMDentro</text><text x="26" y="240" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e"></text><text x="26" y="258" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#00688f">Valor-p = 1 - F.DIST ( [F</text><text x="26" y="276" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">Estatistica], 2, 42, TRUE )</text><rect x="16" y="294" width="404" height="44" rx="6" fill="#fbeddc"/><text x="24" y="310" font-size="11.5" fill="#1a1a2e">Cálculo nativo em DAX, aplicado como</text><text x="24" y="325" font-size="11.5" fill="#1a1a2e">medida do relatório.</text></g><line x1="460.0" y1="46" x2="460.0" y2="394.0" stroke="#d7e3e8" stroke-width="2" stroke-dasharray="4,4"/></svg>