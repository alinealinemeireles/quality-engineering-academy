"16" width="22" height="22" rx="4" fill="#f2c811"/><text x="29.0" y="32.0" text-anchor="middle" font-size="11.0" font-weight="800" fill="#252423" font-family="'Segoe UI', Verdana, sans-serif">fx</text><text x="48" y="33" font-size="15" font-weight="700" fill="#1a1a2e">Power BI (DAX)</text><line x1="16" y1="48" x2="420" y2="48" stroke="#d7e3e8" stroke-width="2"/><rect x="16" y="58" width="404" height="88" rx="7" fill="#fffef6" stroke="#c2650c" stroke-width="1.6"/><text x="26" y="78" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#00688f">Estatistica T = ( 175 - 168 ) / (</text><text x="26" y="96" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">2.2 / SQRT ( 500 ) )</text><text x="26" y="114" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#00688f">Valor-p = 1 - T.DIST ( [Estatistica</text><text x="26" y="132" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">T], 500 - 1, TRUE )</text><rect x="16" y="150" width="404" height="44" rx="6" fill="#fbeddc"/><text x="24" y="166" font-size="11.5" fill="#1a1a2e">Cálculo nativo em DAX, aplicado como</text><text x="24" y="181" font-size="11.5" fill="#1a1a2e">medida do relatório.</text></g><line x1="460.0" y1="46" x2="460.0" y2="254.0" stroke="#d7e3e8" stroke-width="2" stroke-dasharray="4,4"/></svg>