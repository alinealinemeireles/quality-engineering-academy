<svg viewBox="0 0 980 180" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Verdana, sans-serif"><rect x="0" y="0" width="980" height="180" rx="14" fill="#fbfcfc" stroke="#d7e3e8" stroke-width="2"/><text x="490.0" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#00688f">Exemplo: 5 Porquês no Ramo &quot;Procedimento/Método&quot; (bolos queimados)</text><rect x="16" y="50" width="168.8" height="64" rx="10" fill="#e0eff6" stroke="#00688f" stroke-width="1.8"/><text x="100.4" y="74.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">Bolos queimados</text><text x="100.4" y="90.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">(efeito)</text><line x1="184.8" y1="82.0" x2="204.8" y2="82.0" stroke="#1a1a2e" stroke-width="2"/><polygon points="204.8,77.0 212.8,82.0 204.8,87.0" fill="#1a1a2e"/><rect x="210.8" y="50" width="168.8" height="64" rx="10" fill="#e0eff6" stroke="#00688f" stroke-width="1.8"/><text x="295.20000000000005" y="74.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">Horários de forno</text><text x="295.20000000000005" y="90.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">inconsistentes</text><line x1="379.6" y1="82.0" x2="399.6" y2="82.0" stroke="#1a1a2e" stroke-width="2"/><polygon points="399.6,77.0 407.6,82.0 399.6,87.0" fill="#1a1a2e"/><rect x="405.6" y="50" width="168.8" height="64" rx="10" fill="#e0eff6" stroke="#00688f" stroke-width="1.8"/><text x="490.0" y="74.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">Instruções de forno</text><text x="490.0" y="90.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">vagas</text><line x1="574.4000000000001" y1="82.0" x2="594.4000000000001" y2="82.0" stroke="#1a1a2e" stroke-width="2"/><polygon points="594.4000000000001,77.0 602.4000000000001,82.0 594.4000000000001,87.0" fill="#1a1a2e"/><rect x="600.4000000000001" y="50" width="168.8" height="64" rx="10" fill="#e0eff6" stroke="#00688f" stroke-width="1.8"/><text x="684.8000000000001" y="74.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">Instruções não contemplam</text><text x="684.8000000000001" y="90.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">todos os tipos de bolo</text><line x1="769.2" y1="82.0" x2="789.2" y2="82.0" stroke="#1a1a2e" stroke-width="2"/><polygon points="789.2,77.0 797.2,82.0 789.2,87.0" fill="#1a1a2e"/><rect x="795.2" y="50" width="168.8" height="64" rx="10" fill="#e0eff6" stroke="#00688f" stroke-width="1.8"/><text x="879.6" y="66.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">Novos itens no cardápio sem</text><text x="879.6" y="82.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">atualizar instruções</text><text x="879.6" y="98.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">(causa-raiz)</text><rect x="16" y="126" width="948" height="44" rx="6" fill="#e5f4e7"/><text x="26" y="144" font-size="11.5" fill="#1a1a2e">Cadeia dos 5 Porquês aplicada ao ramo Procedimento/Método do exemplo da padaria: cada &quot;por quê&quot; aprofunda a</text><text x="26" y="159" font-size="11.5" fill="#1a1a2e">causa até chegar à causa-raiz verificável.</text></svg>