<svg viewBox="0 0 920 589.0" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Verdana, sans-serif"><rect x="0" y="0" width="920" height="589.0" rx="14" fill="#fbfcfc" stroke="#d7e3e8" stroke-width="2"/><text x="18" y="26" font-size="13.5" font-weight="700" fill="#6b6459" letter-spacing=".4">REGRESSÃO LINEAR</text><line x1="16" y1="36" x2="904" y2="36" stroke="#d7e3e8" stroke-width="2"/><g transform="translate(16,42)"><rect x="0" y="0" width="436" height="196" rx="14" fill="#fbfcfc" stroke="#d7e3e8" stroke-width="2"/><rect x="18" y="16" width="22" height="22" rx="4" fill="#1e7a3f"/><text x="29.0" y="32.0" text-anchor="middle" font-size="13.64" font-weight="800" fill="#ffffff" font-family="'Segoe UI', Verdana, sans-serif">X</text><text x="48" y="33" font-size="15" font-weight="700" fill="#1a1a2e">Excel 365 — caminho de menu</text><line x1="16" y1="48" x2="420" y2="48" stroke="#d7e3e8" stroke-width="2"/><rect x="18" y="66" width="58" height="30" rx="7" fill="#e5f4e7" stroke="#31803a" stroke-width="1.4"/><text x="47.0" y="85.5" text-anchor="middle" font-size="11.5" fill="#31803a" font-weight="600">Dados</text><text x="86" y="86.0" font-size="15" fill="#6b6459">&#8594;</text><rect x="102" y="66" width="135.2" height="30" rx="7" fill="#e5f4e7" stroke="#31803a" stroke-width="1.4"/><text x="169.6" y="85.5" text-anchor="middle" font-size="11.5" fill="#31803a" font-weight="600">Análise de Dados</text><text x="247.2" y="86.0" font-size="15" fill="#6b6459">&#8594;</text><rect x="263.2" y="66" width="84.8" height="30" rx="7" fill="#e5f4e7" stroke="#31803a" stroke-width="1.4"/><text x="305.59999999999997" y="85.5" text-anchor="middle" font-size="11.5" fill="#31803a" font-weight="600">Regressão</text><rect x="16" y="106" width="404" height="74" rx="6" fill="#e5f4e7"/><text x="24" y="122" font-size="11.5" fill="#1a1a2e">passos já descritos acima (Dados →</text><text x="24" y="137" font-size="11.5" fill="#1a1a2e">Análise de Dados → Regressão,</text><text x="24" y="152" font-size="11.5" fill="#1a1a2e">Y=Temperatura, X=Tempo, com *Diagramas</text><text x="24" y="167" font-size="11.5" fill="#1a1a2e">de Ajuste de Linha* marcado).</text></g><g transform="translate(468.0,42)"><rect x="0" y="0" width="436" height="543" rx="14" fill="#fbfcfc" stroke="#d7e3e8" stroke-width="2"/><rect x="18" y="16" width="22" height="22" rx="4" fill="#f2c811"/><text x="29.0" y="32.0" text-anchor="middle" font-size="11.0" font-weight="800" fill="#252423" font-family="'Segoe UI', Verdana, sans-serif">fx</text><text x="48" y="33" font-size="15" font-weight="700" fill="#1a1a2e">Power BI (DAX)</text><line x1="16" y1="48" x2="420" y2="48" stroke="#d7e3e8" stroke-width="2"/><rect x="16" y="58" width="404" height="376" rx="7" fill="#fffef6" stroke="#c2650c" stroke-width="1.6"/><text x="26" y="78" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#00688f">Inclinacao (slope) =</text><text x="26" y="96" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">VAR N = COUNTROWS ( Temperaturas )</text><text x="26" y="114" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">VAR SomaXY = SUMX ( Temperaturas,</text><text x="26" y="132" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">Temperaturas[Tempo] *</text><text x="26" y="150" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">Temperaturas[TempA] )</text><text x="26" y="168" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">VAR SomaX = SUM (</text><text x="26" y="186" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">Temperaturas[Tempo] )</text><text x="26" y="204" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">VAR SomaY = SUM (</text><text x="26" y="222" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">Temperaturas[TempA] )</text><text x="26" y="240" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">VAR SomaX2 = SUMX ( Temperaturas,</text><text x="26" y="258" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">Temperaturas[Tempo] ^ 2 )</text><text x="26" y="276" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">RETURN DIVIDE ( N * SomaXY - SomaX *</text><text x="26" y="294" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">SomaY, N * SomaX2 - SomaX ^ 2 )</text><text x="26" y="312" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e"></text><text x="26" y="330" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#00688f">Intercepto = AVERAGE (</text><text x="26" y="348" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">Temperaturas[TempA] ) - [Inclinacao</text><text x="26" y="366" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">(slope)] * AVERAGE (</text><text x="26" y="384" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">Temperaturas[Tempo] )</text><text x="26" y="402" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#00688f">R Quadrado = [Correlacao Tempo</text><text x="26" y="420" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">TempA] ^ 2</text><rect x="16" y="438" width="404" height="89" rx="6" fill="#fbeddc"/><text x="24" y="454" font-size="11.5" fill="#1a1a2e">Regressão simples (1 variável) é nativa</text><text x="24" y="469" font-size="11.5" fill="#1a1a2e">em DAX; regressão múltipla com</text><text x="24" y="484" font-size="11.5" fill="#1a1a2e">diagnóstico de resíduos já é o caso não-</text><text x="24" y="499" font-size="11.5" fill="#1a1a2e">nativo descrito na introdução desta unit</text><text x="24" y="514" font-size="11.5" fill="#1a1a2e">— aí sim…</text></g><line x1="460.0" y1="46" x2="460.0" y2="583.0" stroke="#d7e3e8" stroke-width="2" stroke-dasharray="4,4"/></svg>