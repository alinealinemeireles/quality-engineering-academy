<svg viewBox="0 0 920 244.0" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Verdana, sans-serif"><rect x="0" y="0" width="920" height="244.0" rx="14" fill="#fbfcfc" stroke="#d7e3e8" stroke-width="2"/><text x="18" y="26" font-size="13.5" font-weight="700" fill="#6b6459" letter-spacing=".4">DISTRIBUIÇÃO BINOMIAL</text><line x1="16" y1="36" x2="904" y2="36" stroke="#d7e3e8" stroke-width="2"/><g transform="translate(16,42)"><rect x="0" y="0" width="436" height="198" rx="14" fill="#fbfcfc" stroke="#d7e3e8" stroke-width="2"/><rect x="18" y="16" width="22" height="22" rx="4" fill="#1e7a3f"/><text x="29.0" y="32.0" text-anchor="middle" font-size="13.64" font-weight="800" fill="#ffffff" font-family="'Segoe UI', Verdana, sans-serif">X</text><text x="48" y="33" font-size="15" font-weight="700" fill="#1a1a2e">Excel 365</text><line x1="16" y1="48" x2="420" y2="48" stroke="#d7e3e8" stroke-width="2"/><rect x="16" y="60" width="26" height="26" fill="#f3f2f1" stroke="#c8c6c4"/><text x="29.0" y="78.0" text-anchor="middle" font-size="12" font-style="italic" fill="#217346" font-weight="700">fx</text><rect x="42" y="60" width="378" height="26" fill="#ffffff" stroke="#c8c6c4"/><text x="50" y="78" font-size="12.5" font-family="Consolas, 'Courier New', monospace" fill="#31803a">=DIST.BINOM(4; 20; 0,05; FALSO)</text><rect x="16" y="92" width="404" height="74" rx="6" fill="#e5f4e7"/><text x="24" y="108" font-size="11.5" fill="#1a1a2e">=DIST.BINOM(4; 20; 0,05; FALSO) →</text><text x="24" y="123" font-size="11.5" fill="#1a1a2e">probabilidade pontual P(X=4). Use</text><text x="24" y="138" font-size="11.5" fill="#1a1a2e">VERDADEIRO no último argumento para a</text><text x="24" y="153" font-size="11.5" fill="#1a1a2e">probabilidade acumulada P(X≤4).</text></g><g transform="translate(468.0,42)"><rect x="0" y="0" width="436" height="192" rx="14" fill="#fbfcfc" stroke="#d7e3e8" stroke-width="2"/><rect x="18" y="16" width="22" height="22" rx="4" fill="#f2c811"/><text x="29.0" y="32.0" text-anchor="middle" font-size="11.0" font-weight="800" fill="#252423" font-family="'Segoe UI', Verdana, sans-serif">fx</text><text x="48" y="33" font-size="15" font-weight="700" fill="#1a1a2e">Power BI (DAX)</text><line x1="16" y1="48" x2="420" y2="48" stroke="#d7e3e8" stroke-width="2"/><rect x="16" y="58" width="404" height="70" rx="7" fill="#fffef6" stroke="#c2650c" stroke-width="1.6"/><text x="26" y="78" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#00688f">P Binomial X4 = COMBIN ( 20, 4 ) *</text><text x="26" y="96" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">POWER ( 0.05, 4 ) * POWER ( 0.95, 20</text><text x="26" y="114" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">- 4 )</text><rect x="16" y="132" width="404" height="44" rx="6" fill="#fbeddc"/><text x="24" y="148" font-size="11.5" fill="#1a1a2e">Cálculo nativo em DAX, aplicado como</text><text x="24" y="163" font-size="11.5" fill="#1a1a2e">medida do relatório.</text></g><line x1="460.0" y1="46" x2="460.0" y2="238.0" stroke="#d7e3e8" stroke-width="2" stroke-dasharray="4,4"/></svg>