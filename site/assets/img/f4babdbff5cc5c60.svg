<svg viewBox="0 0 920 670.0" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Verdana, sans-serif"><rect x="0" y="0" width="920" height="670.0" rx="14" fill="#fbfcfc" stroke="#d7e3e8" stroke-width="2"/><text x="18" y="26" font-size="13.5" font-weight="700" fill="#6b6459" letter-spacing=".4">TESTE QUI-QUADRADO DE ADERÊNCIA</text><line x1="16" y1="36" x2="904" y2="36" stroke="#d7e3e8" stroke-width="2"/><g transform="translate(16,42)"><rect x="0" y="0" width="436" height="274" rx="14" fill="#fbfcfc" stroke="#d7e3e8" stroke-width="2"/><rect x="18" y="16" width="22" height="22" rx="4" fill="#1e7a3f"/><text x="29.0" y="32.0" text-anchor="middle" font-size="13.64" font-weight="800" fill="#ffffff" font-family="'Segoe UI', Verdana, sans-serif">X</text><text x="48" y="33" font-size="15" font-weight="700" fill="#1a1a2e">Excel 365</text><line x1="16" y1="48" x2="420" y2="48" stroke="#d7e3e8" stroke-width="2"/><rect x="16" y="60" width="26" height="26" fill="#f3f2f1" stroke="#c8c6c4"/><text x="29.0" y="78.0" text-anchor="middle" font-size="12" font-style="italic" fill="#217346" font-weight="700">fx</text><rect x="42" y="60" width="378" height="26" fill="#ffffff" stroke="#c8c6c4"/><text x="50" y="78" font-size="12.5" font-family="Consolas, 'Courier New', monospace" fill="#31803a">=DIST.NORM(limite; média;</text><text x="50" y="98" font-size="12.5" font-family="Consolas, 'Courier New', monospace" fill="#31803a">desvio_padrão; VERDADEIRO)</text><text x="50" y="118" font-size="12.5" font-family="Consolas, 'Courier New', monospace" fill="#31803a">=DIST.QUIQUAD(X²; graus_liberdade;</text><text x="50" y="138" font-size="12.5" font-family="Consolas, 'Courier New', monospace" fill="#31803a">VERDADEIRO)</text><rect x="16" y="152" width="404" height="89" rx="6" fill="#e5f4e7"/><text x="24" y="168" font-size="11.5" fill="#1a1a2e">fórmulas já descritas acima —</text><text x="24" y="183" font-size="11.5" fill="#1a1a2e">=DIST.NORM(limite; média; desvio_padrão;</text><text x="24" y="198" font-size="11.5" fill="#1a1a2e">VERDADEIRO) por limite de bin para</text><text x="24" y="213" font-size="11.5" fill="#1a1a2e">montar os esperados,</text><text x="24" y="228" font-size="11.5" fill="#1a1a2e">(Esperado−Observado)²/Esperado po…</text></g><g transform="translate(468.0,42)"><rect x="0" y="0" width="436" height="624" rx="14" fill="#fbfcfc" stroke="#d7e3e8" stroke-width="2"/><rect x="18" y="16" width="22" height="22" rx="4" fill="#f2c811"/><text x="29.0" y="32.0" text-anchor="middle" font-size="11.0" font-weight="800" fill="#252423" font-family="'Segoe UI', Verdana, sans-serif">fx</text><text x="48" y="33" font-size="15" font-weight="700" fill="#1a1a2e">Power BI (DAX)</text><line x1="16" y1="48" x2="420" y2="48" stroke="#d7e3e8" stroke-width="2"/><rect x="16" y="58" width="404" height="502" rx="7" fill="#fffef6" stroke="#c2650c" stroke-width="1.6"/><text x="26" y="78" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">// Coluna calculada em Bins</text><text x="26" y="96" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#00688f">Esperado =</text><text x="26" y="114" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">VAR CdfAtual = NORM.DIST (</text><text x="26" y="132" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">Bins[LimiteSuperior], 48.778,</text><text x="26" y="150" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">11.444, TRUE )</text><text x="26" y="168" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">VAR LimiteAnterior =</text><text x="26" y="186" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">    CALCULATE ( MAX (</text><text x="26" y="204" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">Bins[LimiteSuperior] ),</text><text x="26" y="222" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">Bins[LimiteSuperior] &lt; EARLIER (</text><text x="26" y="240" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">Bins[LimiteSuperior] ) )</text><text x="26" y="258" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">VAR CdfAnterior = IF ( ISBLANK (</text><text x="26" y="276" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">LimiteAnterior ), 0, NORM.DIST (</text><text x="26" y="294" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">LimiteAnterior, 48.778, 11.444, TRUE</text><text x="26" y="312" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">) )</text><text x="26" y="330" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">RETURN ( CdfAtual - CdfAnterior ) *</text><text x="26" y="348" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">50</text><text x="26" y="366" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e"></text><text x="26" y="384" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">// Coluna calculada em Bins</text><text x="26" y="402" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#00688f">Contribuição Qui-Quadrado = DIVIDE (</text><text x="26" y="420" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">( Bins[Esperado] - Bins[Observado] )</text><text x="26" y="438" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">^ 2, Bins[Esperado] )</text><text x="26" y="456" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e"></text><text x="26" y="474" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">// Medida (agrega a coluna calculada</text><text x="26" y="492" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">acima)</text><text x="26" y="510" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#00688f">Valor-p = CHISQ.DIST.RT ( SUM (</text><text x="26" y="528" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">Bins[Contribuição Qui-Quadrado] ),</text><text x="26" y="546" font-size="12" font-family="Consolas, 'Courier New', monospace" fill="#1a1a2e">11 )</text><rect x="16" y="564" width="404" height="44" rx="6" fill="#fbeddc"/><text x="24" y="580" font-size="11.5" fill="#1a1a2e">Cálculo nativo em DAX, aplicado como</text><text x="24" y="595" font-size="11.5" fill="#1a1a2e">medida do relatório.</text></g><line x1="460.0" y1="46" x2="460.0" y2="664.0" stroke="#d7e3e8" stroke-width="2" stroke-dasharray="4,4"/></svg>